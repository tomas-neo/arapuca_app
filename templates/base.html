<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- PWA: Configurações do App -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}?v=3">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <meta name="theme-color" content="#FF6600">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}?v=3">

    <title>{% block titulo %}Arapuca App{% endblock %}</title>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="container">
        <div class="app-bar">
            <img src="{{ url_for('static', filename='icone.png') }}" alt="Arapuca">
            <span>{{ self.titulo() }}</span>
        </div>
        {% block conteudo %}{% endblock %}
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .catch(function (err) { console.log('Falha ao registrar o Service Worker:', err); });
        }
    </script>
</body>
</html>
